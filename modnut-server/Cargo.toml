[package]
name = "modnut-server"
description = "Modern NUT (server)"
authors.workspace = true
repository.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
log = "0.4.34"
env_logger = "0.11.11"
config = "0.15.25"
serde_json = "1.0.151"
hid-types = "0.2.0"
hid-decode = "0.3.0"
hid-descriptor = "0.2.0"

[dependencies.hidapi]
version = "2.6.7"
default-features = false
features = ["linux-static-libusb"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dev-dependencies]
googletest = "0.14.3"
